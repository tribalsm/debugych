[package]
name = "debugych-desktop"
version = "1.2.2"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon"] }
tauri-plugin-single-instance = "=2.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "=0.13.5", features = ["json", "blocking"] }

futures-util = "=0.3.34"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_System_Diagnostics_ToolHelp"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
